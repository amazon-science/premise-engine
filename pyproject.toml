[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "premise-engine"
version = "0.1.0"
description = "Discover, audit, and repair policy rubrics for LLM judges"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  {name = "Swastik Roy"},
  {name = "Rajkumar Pujari"},
  {name = "Tharindu Kumarage"},
  {name = "Charith Peris"},
  {name = "Rahul Gupta"},
  {name = "Anna Rumshisky"},
  {name = "Pradeep Natarajan"},
  {name = "Venkatesh Saligrama"},
]
keywords = [
  "llm-as-a-judge",
  "rubric discovery",
  "preference learning",
  "evaluation",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# These are the packages the `premise` package itself imports. The optional
# group below covers the Streamlit annotation UI, which most readers do not
# need.
dependencies = [
  "click>=8.1",
  "boto3>=1.34",
  "botocore>=1.34",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# `premise.rubric_evaluation.annotate_verifier` — the Streamlit annotation UI.
annotate = [
  "streamlit>=1.30",
]

[project.scripts]
premise = "premise.cli:main"

[project.urls]
Homepage = "https://github.com/amazon-science/premise-engine"
Repository = "https://github.com/amazon-science/premise-engine"

[tool.ruff]
extend-exclude = ["build", ".hatch", "private"]

[tool.ruff.lint]
isort.known-first-party = ["premise"]
# These are deliberate throughout this codebase rather than oversights, so they
# are silenced globally instead of with ~130 inline noqa comments.
ignore = [
  # Long-running pipelines wrap every remote call in `except Exception` on
  # purpose: one throttled Bedrock request must not lose hours of work. The
  # handlers print the exception and continue.
  "BLE001", "S110", "S112",
  # `U, s, Vt = svd(...)` and similar conventional unpacking. Renaming the
  # unused halves to `_` would obscure which factor is which.
  "RUF059",
]

[tool.hatch.build.targets.wheel]
packages = ["premise"]

[tool.hatch.build.targets.wheel.force-include]
"config.json" = "premise/data/default_config.json"
"config.schema.json" = "premise/data/config.schema.json"
"examples/policy_rubrics.json" = "premise/data/policy_rubrics.json"
